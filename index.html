<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Danholsen Workspace</title>
<script>try{var t=JSON.parse(localStorage.getItem("dw.theme")),d=t==="dark"||((t===null||t==="auto")&&matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.dataset.t=d?"dark":"light"}catch(e){document.documentElement.dataset.t="dark"}</script>
<meta name="theme-color" content="#16130E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="favicon-v6.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32-v6.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192-v6.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512-v6.png">
<link rel="apple-touch-icon-precomposed" href="apple-touch-icon-v6.png">
<link rel="shortcut icon" href="favicon-v6.ico">
<link rel="apple-touch-icon" href="apple-touch-icon-v6.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon-v6.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Danholsen">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="application-name" content="Danholsen Workspace">
<meta name="msapplication-TileImage" content="icon-144-v6.png">
<meta name="msapplication-TileColor" content="#16130E">
<link rel="preload" href="public-sans-latin-400-normal.woff" as="font" type="font/woff" crossorigin>
<link rel="preload" href="public-sans-latin-500-normal.woff" as="font" type="font/woff" crossorigin>
<link rel="preload" href="public-sans-latin-600-normal.woff" as="font" type="font/woff" crossorigin>
<link rel="preload" href="public-sans-latin-700-normal.woff" as="font" type="font/woff" crossorigin>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app"></div>
<noscript>Danholsen Workspace needs JavaScript.</noscript>
<script src="store.js"></script>
<script src="jspdf.umd.min.js"></script>
<script src="logo.js"></script>
<script src="publicsans-pdf.js"></script>
<script src="pdf.js"></script>
<script src="pdfinc.js"></script>
<script>
/* Start the app only once storage AND the UI fonts are ready, so text is drawn once in its final font (no fallback-to-Public-Sans swap).
   The font wait is capped at 2.5 s so a slow or failed font load can never block the app. */
(function(){
var F=["400","500","600","700"].map(function(w){return document.fonts?document.fonts.load(w+" 16px 'Public Sans'"):Promise.resolve()});
var fonts=Promise.race([Promise.all(F).catch(function(){}),new Promise(function(r){setTimeout(r,2500)})]);
Promise.all([DWSTORE.ready,fonts]).then(function(){["app.js","pdfedit.js"].forEach(function(s){var e=document.createElement("script");e.src=s;e.async=false;document.body.appendChild(e)})})})();
</script>
</body>
</html>
